replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

volumeClaimTemplate:
  resources:
    requests:
      storage: 5Gi

persistence:
  enabled: true

service:
  type: NodePort
  nodePort: 30920

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.monitoring.enabled: false

readinessProbe:
  failureThreshold: 10
  initialDelaySeconds: 30
  periodSeconds: 10

antiAffinity: "soft"